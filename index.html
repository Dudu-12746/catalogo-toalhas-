<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Toalhas de Mesa</title>
    <style>
        :root {
            --bg: #121214;
            --card-bg: #1e1e24;
            --text: #ffffff;
            --accent: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            background-color: var(--accent);
            color: var(--bg);
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Catálogo de Toalhas de Mesa</h1>
        <p>Escolha o modelo ideal para a sua casa</p>
        
        <div class="btn-group">
            <a href="#" class="btn">Ver Modelos</a>
            <a href="#" class="btn">Fale Conosco</a>
        </div>
    </header>

</body>
</html>
