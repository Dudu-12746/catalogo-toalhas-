<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aluguel de Mesas e Toalhas</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e24;
      --text: #ffffff;
      --accent: #25d366;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .card-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .card-section h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    
    /* Contador de Mesas */
    .qty-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
    }
    .qty-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #333;
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }
    .qty-display {
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* Inputs de formulário */
    .input-group {
      margin-top: 15px;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #aaa;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #121214;
      color: white;
      font-size: 1rem;
    }

    /* Lista de Cores */
    .color-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .color-strip {
      height: 48px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-strip.selected {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(37, 211, 102, 0.5);
    }

    /* Botão de WhatsApp */
    .btn-wsp {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Monte seu Orçamento</h1>
      <p>Escolha os jogos de mesa, as toalhas e informe o local!</p>
    </div>

    <!-- 1. SELEÇÃO DE MESAS -->
    <div class="card-section">
      <h2>1. Jogos de Mesa (Mesa + 4 Cadeiras)</h2>
      <div class="qty-control">
        <span>Quantidade de jogos:</span>
        <div>
          <button class="qty-btn" onclick="alterarQtd(-1)">-</button>
          <span class="qty-display" id="qtd-mesas">0</span>
          <button class="qty-btn" onclick="alterarQtd(1)">+</button>
        </div>
      </div>
    </div>

    <!-- 2. SELEÇÃO DE COR DAS TOALHAS -->
    <div class="card-section">
      <h2>2. Selecione a Cor da Toalha</h2>
      <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 12px;">Clique na cor desejada:</p>
      <div class="color-grid" id="catalog"></div>
    </div>

    <!-- 3. ENDEREÇO DE ENTREGA -->
    <div class="card-section">
      <h2>3. Endereço de Entrega</h2>
      <div class="input-group">
        <label for="endereco">Rua, Número e Bairro do evento:</label>
        <input type="text" id="endereco" placeholder="Ex: Rua das Flores, 123 - Centro">
      </div>
    </div>

    <!-- BOTÃO FINAL -->
    <button class="btn-wsp" onclick="enviarPedido()">
      💬 Enviar Pedido no WhatsApp
    </button>
  </div>

  <script>
    const TELEFONE = "5527988862107";
    let qtdMesas = 0;
    let corSelecionada = "Nenhuma selecionada";

    const cores = [
      { nome: "Branca", hex: "#FFFFFF", dark: true },
      { nome: "Off-White / Palha", hex: "#F5F5DC", dark: true },
      { nome: "Preta", hex: "#000000", dark: false },
      { nome: "Azul Bebê", hex: "#87CEEB", dark: true },
      { nome: "Azul Royal", hex: "#4169E1", dark: false },
      { nome: "Azul Marinho", hex: "#000080", dark: false },
      { nome: "Rosa Bebê", hex: "#FFB6C1", dark: true },
      { nome: "Rosa Chiclete", hex: "#FF1493", dark: false },
      { nome: "Rosa Pink", hex: "#E0115F", dark: false },
      { nome: "Lilás", hex: "#E6E6FA", dark: true },
      { nome: "Vinho / Marsala", hex: "#722F37", dark: false },
      { nome: "Vermelha", hex: "#FF0000", dark: false },
      { nome: "Amarela", hex: "#FFD700", dark: true },
      { nome: "Verde Bandeira", hex: "#008000", dark: false }
    ];

    // Gerar lista de cores
    const catalog = document.getElementById("catalog");
    cores.forEach(c => {
      const div = document.createElement("div");
      div.className = "color-strip";
      div.style.background = c.hex;
      div.style.color = c.dark ? "#000" : "#FFF";
      div.innerHTML = `<span>Toalha ${c.nome}</span><span class="check"></span>`;
      div.onclick = () => selecionarCor(div, c.nome);
      catalog.appendChild(div);
    });

    function alterarQtd(val) {
      qtdMesas = Math.max(0, qtdMesas + val);
      document.getElementById("qtd-mesas").innerText = qtdMesas;
    }

    function selecionarCor(elemento, nome) {
      document.querySelectorAll(".color-strip").forEach(el => el.classList.remove("selected"));
      elemento.classList.add("selected");
      corSelecionada = nome;
    }

    function enviarPedido() {
      const endereco = document.getElementById("endereco").value.trim();

      if (qtdMesas === 0 && corSelecionada === "Nenhuma selecionada") {
        alert("Por favor, selecione ao menos os jogos de mesa ou a cor da toalha!");
        return;
      }

      let texto = `Olá! Gostaria de um orçamento:\n\n`;
      texto += `🪑 *Jogos de Mesa:* ${qtdMesas}\n`;
      texto += `🎨 *Cor da Toalha:* ${corSelecionada}\n`;
      
      if (endereco) {
        texto += `📍 *Endereço de Entrega:* ${endereco}\n`;
      } else {
        texto += `📍 *Endereço de Entrega:* (Não informado)\n`;
      }

      const link = `https://wa.me/${TELEFONE}?text=${encodeURIComponent(texto)}`;
      window.open(link, "_blank");
    }
  </script>
</body>
</html>
